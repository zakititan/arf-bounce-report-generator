<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Report Generator</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg: #f6f7f9; --color-surface: #ffffff;
  --color-border: #dfe3ea; --color-divider: #e6e8ee;
  --color-text: #111827; --color-text-muted: #4b5563; --color-text-faint: #6b7280;
  --color-text-inverse: #ffffff;
  --color-primary: #4f46e5; --color-primary-hover: #4338ca;
  --color-error: #dc2626;
  --radius-md: 0.5rem; --radius-lg: 0.625rem; --radius-xl: 1rem;
  --shadow-sm: 0 1px 2px rgb(16 24 40 / 0.06);
  --shadow-md: 0 1px 3px rgb(16 24 40 / 0.07), 0 8px 24px -10px rgb(16 24 40 / 0.12);
  --shadow-lg: 0 4px 8px -2px rgb(16 24 40 / 0.08), 0 20px 48px -12px rgb(16 24 40 / 0.18);
  --font-body: 'Inter', system-ui, sans-serif;
  --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
  --text-xs: 0.8rem; --text-sm: 0.9rem; --text-base: 1rem; --text-lg: 1.25rem;
}
[data-theme="dark"] {
  --color-bg:#0b0c0e; --color-surface:#15171a;
  --color-border:#2c3036; --color-divider:#22252a;
  --color-text:#f4f5f6; --color-text-muted:#9ba1aa; --color-text-faint:#737a85;
  --color-text-inverse:#101114;
  --color-primary:#818cf8; --color-primary-hover:#6366f1;
  --color-error:#f87171;
  --shadow-sm:0 1px 2px rgb(0 0 0/.35);
  --shadow-md:0 1px 3px rgb(0 0 0/.35), 0 8px 28px -10px rgb(0 0 0/.45);
  --shadow-lg:0 4px 8px -2px rgb(0 0 0/.40), 0 24px 56px -12px rgb(0 0 0/.55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg:#0b0c0e; --color-surface:#15171a;
    --color-border:#2c3036; --color-divider:#22252a;
    --color-text:#f4f5f6; --color-text-muted:#9ba1aa; --color-text-faint:#737a85;
    --color-text-inverse:#101114;
    --color-primary:#818cf8; --color-primary-hover:#6366f1;
    --color-error:#f87171;
    --shadow-sm:0 1px 2px rgb(0 0 0/.35);
    --shadow-md:0 1px 3px rgb(0 0 0/.35), 0 8px 28px -10px rgb(0 0 0/.45);
    --shadow-lg:0 4px 8px -2px rgb(0 0 0/.40), 0 24px 56px -12px rgb(0 0 0/.55);
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-body); font-size: var(--text-base);
  color: var(--color-text); background: var(--color-bg);
  padding: var(--space-4);
}
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, var(--color-primary) 9%, transparent), transparent 70%),
    radial-gradient(ellipse 36% 32% at 84% -6%, color-mix(in srgb, #7c3aed 5%, transparent), transparent 72%);
}
[data-theme="dark"] body::before {
  background:
    radial-gradient(ellipse 46% 40% at 10% 108%, color-mix(in srgb, #a78bfa 10%, transparent), transparent 70%),
    radial-gradient(ellipse 42% 40% at 90% -10%, color-mix(in srgb, var(--color-primary) 13%, transparent), transparent 70%),
    radial-gradient(ellipse 80% 52% at 50% -14%, color-mix(in srgb, var(--color-primary) 16%, transparent), transparent 72%);
}
input, button { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-md); }

.card {
  width: 100%; max-width: 380px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);
  padding: var(--space-8);
  display: flex; flex-direction: column; gap: var(--space-5);
}
.card-header { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); text-align: center; }
.logo-icon { width: 40px; height: 40px; }
.card-title { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }
.card-subtitle { font-size: var(--text-sm); color: var(--color-text-muted); }

.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field label { font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted); }
.input-wrap { position: relative; }
input[type="password"], input[type="text"] {
  width: 100%; padding: var(--space-3) var(--space-8) var(--space-3) var(--space-3);
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); font-size: var(--text-base); color: var(--color-text);
  box-shadow: var(--shadow-sm);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
[data-theme="dark"] input[type="password"], [data-theme="dark"] input[type="text"] { background: var(--color-bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) input[type="password"], :root:not([data-theme="light"]) input[type="text"] { background: var(--color-bg); } }
input:focus {
  outline: none; border-color: var(--color-primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 15%, transparent);
}
.toggle-pw {
  position: absolute; right: var(--space-3); top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--color-text-faint); padding: 2px;
  display: flex; align-items: center;
}
.toggle-pw:hover { color: var(--color-text-muted); }

.theme-toggle { position: fixed; top: var(--space-3); right: var(--space-3); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--color-text-muted); border-radius: var(--radius-md); cursor: pointer; }
.theme-toggle:hover { background: var(--color-divider); color: var(--color-text); }

.btn-submit {
  width: 100%; padding: var(--space-3); border-radius: var(--radius-lg);
  background: var(--color-primary); color: #ffffff;
  border: none; font-size: var(--text-base); font-weight: 600;
  box-shadow: var(--shadow-sm);
  transition: background 160ms ease, transform 120ms ease, box-shadow 120ms ease;
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 46px;
}
.btn-submit:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-md); }
.btn-submit:active:not(:disabled) { transform: translateY(1px); box-shadow: var(--shadow-sm); }
.btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

.error-msg {
  display: none; font-size: var(--text-xs); color: var(--color-error);
  background: color-mix(in srgb, var(--color-error) 8%, var(--color-surface));
  border: 1px solid color-mix(in srgb, var(--color-error) 25%, var(--color-border));
  border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3);
  text-align: center;
}
.error-msg.visible { display: block; }
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
</button>
<div class="card">
  <div class="card-header">
    <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="var(--color-primary)" opacity="0.15"/>
      <rect x="8" y="10" width="14" height="2.5" rx="1.25" fill="var(--color-primary)"/>
      <rect x="8" y="16" width="24" height="2.5" rx="1.25" fill="var(--color-primary)"/>
      <rect x="8" y="22" width="18" height="2.5" rx="1.25" fill="var(--color-primary)"/>
      <circle cx="30" cy="11" r="5" fill="var(--color-primary)"/>
      <path d="M28 11l1.5 1.5L32 9" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="card-title">Report Generator</div>
      <div class="card-subtitle">Enter your password to continue</div>
    </div>
  </div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="field" style="margin-bottom: var(--space-4);">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" autocomplete="current-password"
               placeholder="Enter password" required autofocus>
        <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Toggle password visibility" tabindex="-1">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="error-msg" id="error-msg">Incorrect password. Please try again.</div>
    <button type="submit" class="btn-submit" id="submit-btn" style="margin-top: var(--space-3);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Unlock
    </button>
  </form>
</div>

<script>
(function(){
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch {}
  var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme:dark)').matches);
  if (dark) {
    document.documentElement.setAttribute('data-theme','dark');
  }

  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  var SUN = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';

  function setIcon(dark) {
    var svg = document.querySelector('#theme-toggle svg');
    if (!svg) return;
    svg.innerHTML = dark ? SUN : MOON;
    var btn = document.getElementById('theme-toggle');
    if (btn) btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  setIcon(dark);

  var toggleBtn = document.getElementById('theme-toggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function () {
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('theme', t); } catch {}
      setIcon(t === 'dark');
    });
  }
})();

function togglePw() {
  const inp = document.getElementById('password');
  const icon = document.getElementById('eye-icon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');

  btn.disabled = true;
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 0.8s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Checking…';
  err.classList.remove('visible');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      err.textContent = 'Incorrect password. Please try again.';
      err.classList.add('visible');
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Unlock';
      document.getElementById('password').select();
    }
  } catch {
    err.textContent = 'Network error. Please try again.';
    err.classList.add('visible');
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Unlock';
  }
}
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
